<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengingat</title>
<meta name="theme-color" content="#2145E6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #E8EEF6;
  --card: #FFFFFF;
  --ink: #0F1B2D;
  --muted: #58677E;
  --line: #CFD9E6;
  --accent: #2145E6;
  --accent-ink: #FFFFFF;
  --danger: #B42318;
  --ring: #FFB400;
  --ring-ink: #1A1200;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1626;
    --card: #16223A;
    --ink: #EAF0FA;
    --muted: #9AA9C2;
    --line: #27365A;
    --accent: #7C97FF;
    --accent-ink: #0E1626;
    --danger: #FF8A7A;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 ui-rounded, "Hiragino Maru Gothic ProN", "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main { max-width: 28rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

.clock { padding: 1rem 0 1.5rem; }
.time {
  font-size: 5rem;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.time small { font-size: 1.5rem; color: var(--muted); letter-spacing: 0; margin-left: 0.25rem; }
.date { color: var(--muted); margin-top: 0.5rem; }

.next {
  background: var(--ink);
  color: var(--bg);
  border-radius: 20px;
  padding: 1.1rem 1.25rem;
}
.next .label { font-size: 0.875rem; opacity: 0.75; }
.next .what { font-size: 1.375rem; font-weight: 600; line-height: 1.3; margin: 0.15rem 0; overflow-wrap: anywhere; }
.next .when { font-variant-numeric: tabular-nums; }

.notif { margin: 1rem 0; color: var(--muted); font-size: 0.9375rem; }
.notif p { margin: 0 0 0.5rem; }

.form {
  background: var(--card);
  border-radius: 16px;
  padding: 1rem;
  display: grid;
  gap: 0.75rem;
}
.row { display: flex; gap: 0.75rem; }
.row > * { min-width: 0; }
input[type="text"], input[type="time"] {
  width: 100%;
  font: inherit;
  color: inherit;
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 0.7rem 0.85rem;
  min-height: 46px;
}
input[type="time"] { flex: 1; }
.check { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); font-size: 0.9375rem; }
.check input { width: 1.125rem; height: 1.125rem; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn {
  font: inherit;
  font-weight: 600;
  min-height: 46px;
  padding: 0.7rem 1.1rem;
  border-radius: 12px;
  border: 1.5px solid transparent;
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
}
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.small { min-height: 38px; padding: 0.4rem 0.8rem; font-weight: 500; font-size: 0.9375rem; }
.err { color: var(--danger); font-size: 0.875rem; min-height: 1.25rem; margin: 0; }

.tools { margin-top: 0.75rem; }

ul { list-style: none; margin: 1.5rem 0 0; padding: 0; }
li {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 0.9rem;
  padding: 0.85rem 0;
  border-bottom: 1px solid var(--line);
}
li.empty { display: block; color: var(--muted); border: 0; padding: 0.5rem 0; }
.t { font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
li.done .t, li.done .name { color: var(--muted); text-decoration: line-through; }
.del {
  font: inherit;
  font-size: 0.875rem;
  color: var(--muted);
  background: transparent;
  border: 0;
  padding: 0.6rem 0.5rem;
  min-height: 44px;
  cursor: pointer;
}
.del:hover { color: var(--danger); }

.ring {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: var(--ring);
  color: var(--ring-ink);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2rem 1.5rem;
  padding-top: calc(2rem + env(safe-area-inset-top));
  padding-bottom: calc(2rem + env(safe-area-inset-bottom));
}
.ring[hidden] { display: none; }
.ring-inner { max-width: 28rem; width: 100%; margin: 0 auto; }
.pulse {
  width: 4.5rem;
  height: 4.5rem;
  border: 5px solid var(--ring-ink);
  border-radius: 50%;
  margin-bottom: 1.5rem;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.ring h2 { font-size: 3.25rem; line-height: 1.05; margin: 0 0 1rem; font-weight: 700; letter-spacing: -0.02em; }
.ring-list p { font-size: 1.5rem; margin: 0 0 0.5rem; font-weight: 500; overflow-wrap: anywhere; }
.ring-actions { display: grid; gap: 0.75rem; margin-top: 2rem; }
.ring .btn { background: var(--ring-ink); color: #FFE9A8; min-height: 54px; font-size: 1.0625rem; }
.ring .btn.ghost { background: transparent; color: var(--ring-ink); border-color: var(--ring-ink); }
</style>
</head>
<body>
<main>
  <header class="clock">
    <div id="time" class="time">--:--</div>
    <div id="date" class="date"></div>
  </header>

  <section id="next" class="next" aria-live="polite"></section>

  <section id="notif" class="notif"></section>

  <form id="form" class="form" autocomplete="off">
    <input id="text" type="text" placeholder="Minum obat, meeting, kirim laporan" maxlength="80" aria-label="Nama tugas">
    <div class="row">
      <input id="tm" type="time" aria-label="Jam alarm">
      <button class="btn" type="submit">Tambah alarm</button>
    </div>
    <label class="check"><input id="repeat" type="checkbox"> Ulangi tiap hari</label>
    <p id="err" class="err" aria-live="polite"></p>
  </form>

  <div class="tools">
    <button id="test" class="btn ghost small" type="button">Tes alarm 10 detik</button>
  </div>

  <ul id="list"></ul>
</main>

<div id="ring" class="ring" hidden role="alertdialog" aria-modal="true" aria-labelledby="ring-title">
  <div class="ring-inner">
    <div class="pulse" aria-hidden="true"></div>
    <h2 id="ring-title">Waktunya!</h2>
    <div id="ring-list" class="ring-list"></div>
    <div class="ring-actions">
      <button id="stop" class="btn" type="button">Matikan</button>
      <button id="snooze" class="btn ghost" type="button">Tunda 5 menit</button>
    </div>
  </div>
</div>

<script>
const KEY = 'pengingat:v1';
const DAY = 24 * 60 * 60 * 1000;
const SNOOZE = 5 * 60 * 1000;

let items = load();
let ringing = [];
let audioCtx = null;
let beepTimer = null;
let swReg = null;

const $ = (id) => document.getElementById(id);

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch (e) { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch (e) {}
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function hhmm(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  if (s < 60) return s + ' dtk';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' mnt';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' jam ' + (m % 60) + ' mnt';
  return Math.floor(h / 24) + ' hari ' + (h % 24) + ' jam';
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function unlockAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);

function beep(freq, start, dur) {
  const t0 = audioCtx.currentTime + start;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
function playPattern() {
  if (audioCtx && audioCtx.state === 'running') {
    beep(880, 0, 0.18);
    beep(880, 0.25, 0.18);
    beep(1175, 0.5, 0.35);
  }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function startSound() {
  if (beepTimer) return;
  playPattern();
  beepTimer = setInterval(playPattern, 2000);
}
function stopSound() {
  clearInterval(beepTimer);
  beepTimer = null;
  if (navigator.vibrate) navigator.vibrate(0);
}

async function notify(item) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {
    body: item.text,
    tag: 'pengingat-' + item.id,
    renotify: true,
    requireInteraction: true,
    vibrate: [200, 100, 200],
    icon: 'icon-192.png',
    badge: 'icon-192.png'
  };
  try {
    const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
    if (reg) { await reg.showNotification('Waktunya!', opts); return; }
  } catch (e) {}
  try { new Notification('Waktunya!', opts); } catch (e) {}
}

function renderNotif() {
  const box = $('notif');
  box.textContent = '';
  if (!('Notification' in window)) {
    box.appendChild(el('p', '', 'Browser ini belum mendukung notifikasi. Alarm tetap berbunyi selama halaman terbuka.'));
    return;
  }
  const p = Notification.permission;
  if (p === 'granted') {
    box.appendChild(el('p', '', 'Notifikasi aktif.'));
  } else if (p === 'denied') {
    box.appendChild(el('p', '', 'Notifikasi diblokir. Izinkan lewat pengaturan situs di browser lo.'));
  } else {
    box.appendChild(el('p', '', 'Aktifkan notifikasi supaya alarm tetap muncul walau tab ada di belakang.'));
    const b = el('button', 'btn small', 'Aktifkan notifikasi');
    b.type = 'button';
    b.addEventListener('click', async () => {
      unlockAudio();
      try { await Notification.requestPermission(); } catch (e) {}
      renderNotif();
    });
    box.appendChild(b);
  }
}

function renderClock(now) {
  const d = new Date(now);
  const t = $('time');
  t.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  t.appendChild(el('small', '', pad(d.getSeconds())));
  $('date').textContent = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function renderNext(now) {
  const box = $('next');
  box.textContent = '';
  const pending = items
    .filter((i) => !i.done && !ringing.includes(i.id))
    .sort((a, b) => a.ts - b.ts)[0];
  if (!pending) {
    box.appendChild(el('div', 'label', 'Alarm berikutnya'));
    box.appendChild(el('div', 'what', 'Belum ada alarm'));
    box.appendChild(el('div', 'when', 'Tambah satu di bawah.'));
    return;
  }
  box.appendChild(el('div', 'label', 'Alarm berikutnya'));
  box.appendChild(el('div', 'what', pending.text));
  box.appendChild(el('div', 'when', 'Jam ' + hhmm(pending.ts) + ', dalam ' + fmt(pending.ts - now)));
}

function renderList() {
  const ul = $('list');
  ul.textContent = '';
  if (!items.length) {
    ul.appendChild(el('li', 'empty', 'Belum ada alarm. Isi tugas dan jam di atas, lalu tekan Tambah alarm.'));
    return;
  }
  const sorted = [...items].sort((a, b) => (a.done - b.done) || (a.ts - b.ts));
  sorted.forEach((it) => {
    const li = el('li', it.done ? 'done' : '');
    li.appendChild(el('div', 't', hhmm(it.ts)));
    const mid = el('div');
    mid.appendChild(el('div', 'name', it.text));
    const sub = el('div', 'sub');
    sub.dataset.id = it.id;
    mid.appendChild(sub);
    li.appendChild(mid);
    const del = el('button', 'del', 'Hapus');
    del.type = 'button';
    del.dataset.del = it.id;
    del.setAttribute('aria-label', 'Hapus alarm ' + it.text);
    li.appendChild(del);
    ul.appendChild(li);
  });
  updateSubs(Date.now());
}

function updateSubs(now) {
  document.querySelectorAll('#list .sub').forEach((s) => {
    const it = items.find((x) => x.id === s.dataset.id);
    if (!it) return;
    if (it.done) s.textContent = 'Selesai';
    else if (ringing.includes(it.id)) s.textContent = 'Berbunyi sekarang';
    else s.textContent = 'dalam ' + fmt(it.ts - now) + (it.repeat ? ', tiap hari' : '');
  });
}

function showRing() {
  const box = $('ring-list');
  box.textContent = '';
  ringing.forEach((id) => {
    const it = items.find((x) => x.id === id);
    if (it) box.appendChild(el('p', '', it.text));
  });
  $('ring').hidden = false;
  $('stop').focus();
}
function hideRing() {
  $('ring').hidden = true;
  stopSound();
}

function stopAlarm() {
  const now = Date.now();
  ringing.forEach((id) => {
    const it = items.find((x) => x.id === id);
    if (!it) return;
    if (it.repeat) { while (it.ts <= now) it.ts += DAY; }
    else it.done = true;
  });
  ringing = [];
  save();
  hideRing();
  renderList();
  tick();
}

function snoozeAlarm() {
  const now = Date.now();
  ringing.forEach((id) => {
    const it = items.find((x) => x.id === id);
    if (it) it.ts = now + SNOOZE;
  });
  ringing = [];
  save();
  hideRing();
  renderList();
  tick();
}

function addItem(text, ts, repeat) {
  items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    text: text,
    ts: ts,
    repeat: !!repeat,
    done: false
  });
  save();
  renderList();
  tick();
}

function tick() {
  const now = Date.now();
  renderClock(now);
  const due = items.filter((i) => !i.done && i.ts <= now && !ringing.includes(i.id));
  if (due.length) {
    due.forEach((i) => { ringing.push(i.id); notify(i); });
    showRing();
    startSound();
    renderList();
  }
  renderNext(now);
  updateSubs(now);
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  unlockAudio();
  const text = $('text').value.trim();
  const tm = $('tm').value;
  const err = $('err');
  if (!text) { err.textContent = 'Isi dulu nama tugasnya.'; $('text').focus(); return; }
  if (!tm) { err.textContent = 'Pilih jamnya dulu.'; $('tm').focus(); return; }
  err.textContent = '';
  const parts = tm.split(':').map(Number);
  const d = new Date();
  d.setHours(parts[0], parts[1], 0, 0);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
  addItem(text, d.getTime(), $('repeat').checked);
  $('text').value = '';
});
$('text').addEventListener('input', () => { $('err').textContent = ''; });
$('tm').addEventListener('input', () => { $('err').textContent = ''; });

$('test').addEventListener('click', () => {
  unlockAudio();
  addItem('Tes alarm', Date.now() + 10000, false);
});

$('list').addEventListener('click', (e) => {
  const id = e.target.dataset.del;
  if (!id) return;
  items = items.filter((i) => i.id !== id);
  ringing = ringing.filter((x) => x !== id);
  save();
  renderList();
  tick();
});

$('stop').addEventListener('click', stopAlarm);
$('snooze').addEventListener('click', snoozeAlarm);

document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((r) => { swReg = r; }).catch(() => {});
}

renderNotif();
renderList();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
